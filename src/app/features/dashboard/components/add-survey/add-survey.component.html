<form (ngSubmit)="addSurvey($event)">
    <div>
        <label for="title">Titre Du Survey</label>
        <input type="text"  id="title">
    </div>
    <div>
        <label for="description">Description</label>
        <textarea id="description"></textarea>
    </div>
    <div>
        <label for="onwer">Createur</label>
        <select id="onwer">
            <option value="1">Oussama</option>
        </select>
    </div>
    <div>
        <button type="submit" >Ajouter</button>
    </div>
</form>
